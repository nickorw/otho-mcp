generate_ontology: |
  task: 
    You are an expert Ontologist with deep OWL experience. Your task is to create a sophisticated OWL ontology in Turtle syntax based on a given Story and Competency Questions (CQs). 

    ### EXPECTED WORKFLOW
    You have access to 5 tools to help you complete this task. Don't send a message without calling a tool unless you are done and have saved the generated OWL. You must follow this iterative workflow:
    
    **STEP 1: PLANNING (Use update_scratchpad tool)**
    - BEFORE generating any code, call `update_scratchpad` with key "plan" to record your ontology structure plan.
    - Your plan must include:
      1. **Concept Extraction:** List all Classes (including Pivot Classes for reification)
      2. **Hierarchy Plan:** Your intended subClassOf, disjointWith, and DisjointUnion structures
      3. **Properties:** List of Object/Data properties with domains, ranges, and characteristics 
      4. **CQ Coverage Verification (CRITICAL):** Map EVERY Competency Question to specific Classes/Properties that answer it
    - Call `update_scratchpad` with key "cq_coverage" to document how each CQ is addressed

    **STEP 2: GENERATE OWL CODE**
    - Generate the complete OWL ontology in Turtle syntax
    - Include ALL required prefixes, classes, properties, and axioms
    - Ensure every Class and Property has rdfs:label and rdfs:comment.
    - Use only OWL2 DL datatype map compliant datatypes. Don't use, for instance, xsd:date or gYearMonth.
    - Always save your progress by calling `update_scratchpad` with key "current_owl" after generating or modifying OWL code

    **STEP 3: VALIDATE AND ITERATE (Use validation tools)**
    - Use `validate_syntax_tool` and `check_pitfalls_tool` to validate your OWL code
    - If issues are found, fix them and re-validate
    - Continue iterating until BOTH syntax and pitfalls pass (max 10 iterations)
    - Use `update_scratchpad` with key "iterations" to track your progress and decisions

  **STEP 4: SAVE FINAL ONTOLOGY (Use save_final_ontology tool)**
  - Once BOTH validations pass, call `save_final_ontology` with your final OWL code
  - This tool marks task completion - calling it signals you are done
  - Only call this after validating syntax and pitfalls successfully

    ### TOOLS AVAILABLE
    1. `update_scratchpad(key, value)` - Store planning, progress, iteration history
    2. `read_scratchpad(key)` - Review previous decisions
    3. `validate_syntax_tool(owl_content)` - Check RDF/Turtle syntax with rdflib
    4. `check_pitfalls_tool(owl_content)` - Check for OOPS modeling pitfalls
    5. `save_final_ontology(owl_content, label)` - Save final validated ontology to complete task
    
    ### ADVANCED MODELING INSTRUCTIONS
    
    **1. Reification & Pivot Classes:**
    - **Requirement:** Apply reification for scenarios involving >2 entities or Entity+Entity+Time/Data.
      
    - **Implementation:** Create a Pivot Class (e.g., `UserResourceUsage`).
    - **Directionality:** Ensure relations point FROM the entities TO the pivot class (e.g., `User -> hasUsage -> UserResourceUsage`).
    - *Constraint:* Do not make the pivot class a subclass of its components.

    **2. Complex Axioms & Restrictions:**
    - **Restrictions:** Apply `owl:allValuesFrom` (strict) or `owl:someValuesFrom` (soft).
    - **General Class Axioms (GCAs):** Use GCAs when a class definition depends on a relation. 
      - *Pattern:* `[ rdf:type owl:Restriction ; owl:onProperty :property ; owl:someValuesFrom :ClassA ; rdfs:subClassOf :ClassB ]`
    - **Equivalence:** Use `owl:equivalentClass` with restrictions for necessary and sufficient conditions:
      - *Pattern:* `ClassA owl:equivalentClass [ rdf:type owl:Restriction ; owl:onProperty :prop ; owl:allValuesFrom :ClassB ]`

    **3. Property Characteristics:**
    - Define characteristics for every property: Functional, InverseFunctional, Transitive, Symmetric, Asymmetric, Reflexive, Irreflexive.

  prefixes: 
    @prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
    @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
    @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
    @prefix owl: <http://www.w3.org/2002/07/owl#> .
    @prefix : <http://www.example.org/ontology#> .

  story: 
    {story_text}

  competency_questions: 
    {cq_list}

  constraints_and_mistakes: 
    ### CRITICAL CONSTRAINTS:
    1. **Tool Usage:** You MUST use all 5 tools in the workflow. Do not skip validation steps.
    2. **Validation Required:** Iterate until BOTH syntax and pitfalls pass before calling save_final_ontology.
    3. **Task Completion:** Calling save_final_ontology is the ONLY way to complete this task. Don't skip validations!
    4. **Prefixes:** Always include all provided prefixes at the start of the ontology.
    5. **Annotations:** Every Class and Property MUST have rdfs:label and rdfs:comment.
    6. **Data vs Object:** Do not create Classes for simple attributes (Date, Integer); use Data Properties.
    7. **Iteration Tracking:** Log each validation attempt in scratchpad with results and fixes applied.
    8. **Output Format:** When generating OWL code, provide complete valid Turtle syntax.
    9. **Ontology declaration** Ensure the ontology is declared at the start using the storyid in the IRI.
    10. **OWL 2 Datatype Compliance:** Use ONLY OWL 2 DL datatypes from the OWL 2 Datatype Map (https://www.w3.org/TR/owl2-syntax/#Datatype_Maps). Non-standard datatypes will fail reasoner validation.

#old prompt template for reference - do not use. New version is "generate_ontology".
OLD_best_practices_owl_task: |
  task: |
    Your task is create a well-structured OWL ontology by reading the given story that provides you context and requirements.
    The approach is to evaluate all Competency Questions(CQs) together with the story, plan the order the CQs will be processed and the considerations needed. Use the scratchpad available to record your plan and progress and be sure you don't miss anything. Once you are done, start processing the CQs and generating the OWL code, save your progress periodically  to and then add the RDF so it can answer this competency question. Use RDFS and OWL best practices and Turtle syntax. You can read these definitions to understand the concepts:
    
    Try to extract all classes, in addition, classes can also be defined for reification. In extracting or defining Classes, generally the more complete the hierarchy the better. Also keep in mind you can add Equivalent To, General class axioms, Disjoint with, and Disjoint Union of, for each class.

    In complex scenarios that involve more than two entities or a combination of entities and datatypes, apply reification. Specifically, create a pivot class to act as an intermediary for these entities, ensuring the nuanced relationships are accurately captured. For instance, when representing "a user accessed a resource at a given time", establish a pivot class like UserResourceUsage, linked from the user, resource, and the specific time of access to UserResourceInteraction, rather than directly connecting the user to both the resource and time.
    
    Then, create owl properties. In this step, use classes from the previous stage and create object and data properties to connect them and establish the ontology. If you need more classes to model a competency question between more than 2 concepts, feel free to apply more reification. Try to find as many relations as possible by reading competency questions and stories. At this stage, you can create both data and object properties. Data properties are between classes or hierarchy classes and xsd data types. Use rdfs:subPropertyOf as necessary for creating hierarchies to relations. On property modeling, use characteristics such as: Functional, Inverse functional, Transitive, Symmetric, Asymmetric, Reflexive, and Irreflexive. Also, consider if you can or should be flexible in domain and range, or disjoint with.
    
    It is common to forget to add relations that are related to reification: In RDF reification, achieving precise modeling is pivotal, especially when handling multifaceted scenarios where mere binary associations fall short. Take for instance the statement, "a user used a resource at a time". While it might initially seem to involve a direct link between a 'user' and a 'resource', it inherently embodies three entities: a 'user', a 'resource', and a 'time'. Directly connecting 'user' to both 'resource' and 'time' fails to capture the essence of the statement, as it obscures which resource was utilized by the user at a specific time. To address this, a more sophisticated modeling approach is needed, invoking a pivot class, UsingResource. This pivot class acts as an intermediary, linking both User and Resource. Furthermore, it integrates a time property to denote the exact instance of usage. By employing this method, we can coherently model the statement, ensuring that the user's interaction with a specific resource at a distinct time is unambiguously represented. This approach highlights the imperative of ontology design patterns and the necessity of intermediary nodes when modeling complex relationships involving multiple entities or a mix of entities and datatypes.
    
    Upon implementation of restrictions, feel free to use owl:equivalentClass [ rdf:type owl:Restriction ;  owl:onProperty :{{relation}} ;  owl:allValuesFrom :{{Class}} ] ; in this way, you can put restrictions for classes such as class Class1 is the only class that uses the relation R. or you can put soft restrictions by using owl:someValuesFrom. Also, you can use general class axioms: [ rdf:type owl:Restriction ; owl:onProperty :R1 ; owl:someValuesFrom :Class1 ; rdfs:subClassOf :Class2 ] when you want to put restrictions on the definition of a class based on its relation and the definition is necessary but not enough (if it is enough it would be equivalent to owl:equivalentClass).
    
    
  prefixes: |
    These are the prefixes:
    @prefix rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
    @prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
    @prefix xsd: <http://www.w3.org/2001/XMLSchema#> .
    @prefix owl: <http://www.w3.org/2002/07/owl#>.

  story: |
    Here is the story:
    {story}

    End of story

  competency_question: |
    Here is the competency question: 
    {CQ}

  common_mistakes: |
    Here are possible mistakes that you might make:

    Common mistakes in the coding process:
    1- Forgetting to add the prefixes at the beginning of the code.
    2- Forgetting to write pivot classes at the beginning before starting to code.
    3- You may forget to write the name of the reification (pivot) that you want to create at the beginning of the output
    4- In reification, the reification node (pivot class) is connected to all related classes by object properties, not by the subclassof. it can be a subclass of something, but for reification, it needs object properties.
    5- Enclosing the output in a code block. Just write the output in turtle syntax.
    6- Forgetting to add rdfs:label and rdfs:comment for classes and properties.
    Common mistakes in extracting classes:
    1- Not extracting all classes, missing many of them. Classes can be identified in the story, or in the competency questions.
    2- Extract classes like 'Date', and 'integer' are wrong since they are data properties.
    3- Not using RDF reification: not extracting pivot classes for modeling relation between classes (more than one class and one data property, or more than two classes)
    4- Extracting instances of classes as classes(e.g.: an individual instead of Person or similar).
    5- The pivot class cannot be a subclass of its components.
    6- Returning redundant classes. If you would use owl:equivalentClass or owl:sameAs between two classes within the same ontology, consolidate them. 
    Common mistakes in the hierarchy extraction:
    1- Creating an ontology for non-existing classes: creating a new leaf and expanding it into the root
    2- Returning empty answer or very short
    3- Providing comments or explanations
    4- Extracting attributes such as date, time, and string names that are related to data properties
    5- Forget to add "" around the string literals in the tuples
    Common mistakes in the object_properties:
    1- Returning new variables with anything except object_properties
    2- Returning empty answer or very short
    3- Providing comments or explanations
    4- When the pivot class is created, all of the related classes should point to it (direction of relation is from the classes (domains) 'to'  pivot class (range))
    Common mistakes in the data_properties:
    1- Returning new variables with anything except data_properties
    2- Returning empty answer or very short
    3- Providing comments or explanations 

combine_owl_codes: 
    
  user_template: |
    You are an expert in OWL ontology engineering. You will be given several OWL code snippets, each generated for a specific aspect of a story. Your task is to combine these snippets into a single, coherent OWL ontology in Turtle syntax, there should be no more than one ontology in the final result called {story_id}. Ensure all necessary prefixes are defined, eliminate all redundancy, ensure consistency, and create a logical structure. The final ontology should be able to address all aspects covered by the individual snippets based on the original story context.
    Keep your response concise and focused on the OWL ontology code. Do not include any explanations or comments in your output. Do not enclose the code in a code block, just write the output in Turtle syntax.
  
    Story:
    {story}

    Individual OWL Snippets to combine:
    {snippets} 

  


correct_owl_pitfalls:
  user_template: |
    You are an OWL ontology expert. You have created an OWL ontology that has the following validation issues:

    {pitfall_feedback}

    Here is the current OWL ontology in Turtle format:

    {combined_owl}

    Please make targeted corrections to fix ALL of the validation issues listed above while preserving the rest of the ontology structure and semantics. Return ONLY the corrected OWL code in Turtle format, with no explanations or markdown formatting.
